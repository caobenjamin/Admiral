services:
  postgres:
    image: postgres:16-alpine
    container_name: admiral-postgres
    environment:
      POSTGRES_USER: admiral
      POSTGRES_PASSWORD: admiral
      POSTGRES_DB: admiral
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admiral"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
