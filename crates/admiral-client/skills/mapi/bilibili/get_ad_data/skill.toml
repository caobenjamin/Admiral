[skill]
id = "bili.report.query"
name = "查询B站广告自定义报表"
category = "mapi"
platform = "bilibili"
version = "1.0.0"

[skill.description]
short = "查询自定义投放报表数据，支持多维度多指标组合；一次只能查一天（start_time 与 end_time 必须相同）"
long = "调用 Bilibili Marketing API 自定义报表接口。支持按日期/小时、账户/计划/单元/创意等维度，查询展示、点击、消耗等指标。仅返回有消耗的数据。金额建议用 charged_cost_milli（毫分，元=值/10^5）。一次请求仅支持查询一天，多日需分次调用。"

[skill.risk]
level = "low"
requires_dry_run = false
requires_test_run = false
requires_user_confirm = false
is_reversible = true

[skill.input]
required = ["account_id", "start_time", "end_time", "dimensions", "metrics", "filters", "order_by", "page", "size"]
optional = []

[skill.api]
method = "POST"
path = "open_api/report/v3/custom/query"
rate_limit = "30/min"

[skill.llm_tool]
name = "bili_report_query"
description = "查询广告自定义报表。必填：account_id、start_time 与 end_time（yyyy-MM-DD 且相同，只查一天）、dimensions（仅允许 date_time/account_id/campaign_id/unit_id/creative_id）、metrics（至少含 show_count/click_count/charged_cost_milli，排序字段须在其中）、filters（对象数组，无则 []）、order_by（仅 1 个元素的数组 [{ field, type }]，field 须在 metrics 中，type 为字符串 \"1\" 升序 \"2\" 降序）、page、size（最大100）。"

[skill.llm_tool.parameters_schema]
type = "object"
required = ["account_id", "start_time", "end_time", "dimensions", "metrics", "filters", "order_by", "page", "size"]
# order_by: array 且仅 1 个元素；元素为 { field: string, type: "1"|"2" }
[skill.llm_tool.parameters_schema.properties]
account_id = { type = "integer", description = "广告主账户ID" }
start_time = { type = "string", description = "开始日期 yyyy-MM-DD" }
end_time = { type = "string", description = "结束日期 yyyy-MM-DD，必须与 start_time 相同" }
dimensions = { type = "array", description = "维度，仅允许: date_time, account_id, campaign_id, unit_id, creative_id", items = { type = "string" } }
metrics = { type = "array", description = "指标，至少含 show_count/click_count/charged_cost_milli；排序字段须在此列表中", items = { type = "string" } }
filters = { type = "array", description = "过滤条件，无则 []" }
page = { type = "integer", description = "页码，默认1" }
size = { type = "integer", description = "每页数量，最大100" }

[skill.llm_tool.parameters_schema.properties.order_by]
type = "array"
minItems = 1
maxItems = 1
description = "排序条件，仅 1 个元素；元素为 { field, type }，field 须在 metrics 中，type 为字符串 \"1\" 升序 \"2\" 降序"

[skill.llm_tool.parameters_schema.properties.order_by.items]
type = "object"
required = ["field", "type"]

[skill.llm_tool.parameters_schema.properties.order_by.items.properties]
field = { type = "string", description = "排序字段，须在 metrics 中" }
type = { type = "string", description = "排序类型：\"1\" 升序 \"2\" 降序" }
