[skill]
id = "bili.adgroup.list"
name = "查询B站广告单元列表"
category = "mapi"
platform = "bilibili"
version = "1.0.0"

[skill.description]
short = "查询指定账户或计划下的新三连单元列表"
long = "调用 Bilibili Marketing API 批量查询新三连单元详情，包括单元名称、状态、推广内容、定向及出价等信息。支持按计划ID、单元ID、状态筛选。"

[skill.risk]
level = "low"
requires_dry_run = false
requires_test_run = false
requires_user_confirm = false
is_reversible = true

[skill.input]
required = ["account_id"]
optional = ["campaign_ids", "unit_ids", "unit_status", "start_ctime", "end_ctime", "start_mtime", "end_mtime", "page", "size"]

[skill.api]
method = "GET"
path = "open_api/cpc/v3/unit/list_units"
rate_limit = "60/min"

[skill.llm_tool]
name = "bili_adgroup_list"
description = "查询指定账户下的新三连广告单元列表。可选：campaign_ids(逗号分隔)、unit_ids(逗号分隔，最多100个)、unit_status(1有效2已暂停3已结束4已删除5未开始6预算超限7不在投放时段8已完成，多选逗号)、page、size(默认10，范围1-100)。时间筛选为毫秒时间戳，起止跨度不超过24小时。"

[skill.llm_tool.parameters_schema]
type = "object"
required = ["account_id"]
properties = { account_id = { type = "integer", description = "广告主账户ID" }, campaign_ids = { type = "string", description = "计划ID列表，逗号分隔" }, unit_ids = { type = "string", description = "单元ID列表，逗号分隔，最多100个" }, unit_status = { type = "string", description = "单元状态：1有效2已暂停3已结束4已删除5未开始6预算超限7不在投放时段8已完成，多选逗号" }, page = { type = "integer", description = "页码，默认1" }, size = { type = "integer", description = "每页数量，默认10，范围1-100" } }
