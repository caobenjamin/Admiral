[package]
name = "admiral-client"
description = "Admiral desktop client - Tauri 2 based ad automation agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
admiral-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { workspace = true }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
open = "5"

# Local database
rusqlite = { version = "0.32", features = ["bundled"] }

# Config directory (cross-platform)
dirs = "5"

# Network
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
# tokio-tungstenite = "0.24"

# Crypto (for credential file encryption)
# aes-gcm = "0.10"
# zeroize = "1"

# TOML (skill.toml, agent_profile.toml)
toml = "0.8"

# Cron scheduler
tokio-cron-scheduler = "0.11"

# Rate limiting for MAPI calls
governor = "0.8"
dashmap = "6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "admiral_client_lib"
path = "src/lib.rs"

[[bin]]
name = "admiral-client"
path = "src/main.rs"
